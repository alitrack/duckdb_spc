[package]
name = "duckdb_spc"
version = "0.1.0"
edition = "2021"
description = "DuckDB extension: Statistical Process Control — process capability (Cp/Cpk/Pp/Pk) + control chart limits (I-MR, Xbar-R)"
license = "MIT"
repository = "https://github.com/alitrack/duckdb_spc"

[lib]
name = "spc_ext"
crate-type = ["cdylib", "rlib"]

[profile.release]
lto = true
strip = true

[dependencies]
quack-rs = "0.14"
libduckdb-sys = "1.10504"
libm = "0.2"
