name: Main Extension Distribution Pipeline
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/master' || github.sha }}
  cancel-in-progress: true

jobs:
  linux-amd64-smoke:
    name: Linux amd64 smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install build deps
        run: |
          sudo apt-get update -y -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq make ninja-build jq
      - name: Configure
        run: make configure
      - name: Build
        run: make release
      - name: SQLLogicTest
        run: make test_release
      - name: Verify
        run: ls -la build/release/spc_ext.duckdb_extension
      - name: Dual-line verify (load built ext on DuckDB 1.5.6 + 2.0.0 GA)
        run: |
          set -euo pipefail
          curl -sL -o /tmp/d156.gz https://github.com/duckdb/duckdb/releases/download/v1.5.6/duckdb_cli-linux-amd64.gz && gzip -d -f /tmp/d156.gz && chmod +x /tmp/d156
          curl -sL -o /tmp/d200.tgz https://github.com/duckdb/duckdb/releases/download/v2.0.0/duckdb-cli-linux-amd64.tar.gz && tar xzf /tmp/d200.tgz -C /tmp
          /tmp/d156 -unsigned -c "LOAD 'build/release/spc_ext.duckdb_extension'; SELECT version() AS v156;"
          /tmp/duckdb -unsigned -c "LOAD 'build/release/spc_ext.duckdb_extension'; SELECT version() AS v200;"
          echo 'OK: built extension (v1.x stable C API) loads on both the 1.5.x and 2.0.x GA hosts.'

  macos-arm64-smoke:
    name: macOS arm64 smoke
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Ninja
        run: brew install ninja
      - name: Configure
        run: make configure
      - name: Build
        run: make release
      - name: SQLLogicTest
        run: make test_release

  duckdb-stable-build:
    name: Distribution
    needs: [linux-amd64-smoke, macos-arm64-smoke]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5-variegata
    with:
      duckdb_version: v1.5.5
      ci_tools_version: v1.5-variegata
      extension_name: spc_ext
      extra_toolchains: rust
      exclude_archs: 'linux_amd64_musl;wasm_mvp;wasm_eh;wasm_threads;windows_amd64_rtools;windows_amd64_mingw'
    secrets: inherit

  duckdb-20-build:
    name: Distribution (DuckDB 2.0)
    needs: [linux-amd64-smoke, macos-arm64-smoke]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v2.0-cyanoptera
    with:
      duckdb_version: v2.0.0
      ci_tools_version: v2.0-cyanoptera
      extension_name: spc_ext
      extra_toolchains: rust
      exclude_archs: 'linux_amd64_musl;wasm_mvp;wasm_eh;wasm_threads;windows_amd64_rtools;windows_amd64_mingw'
    secrets: inherit

  release:
    name: Create GitHub Release
    needs: [duckdb-stable-build, duckdb-20-build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Rename release assets with platform + duckdb-version suffix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          shopt -s nullglob

          for artifact_dir in artifacts/*; do
            [ -d "$artifact_dir" ] || continue
            artifact_name=$(basename "$artifact_dir")
            # artifact_name = <ext>-<duckdb_version>-extension-<arch>[postfix]
            platform_suffix="${artifact_name##*-extension-}"
            rest="${artifact_name%*-extension-*}"
            duck_line="${rest##*-}"

            for asset in "$artifact_dir"/*.duckdb_extension "$artifact_dir"/*.duckdb_extension.wasm; do
              [ -f "$asset" ] || continue
              asset_name=$(basename "$asset")

              if [[ "$asset_name" == *.duckdb_extension.wasm ]]; then
                extension_suffix=".duckdb_extension.wasm"
                stem="${asset_name%.duckdb_extension.wasm}"
              else
                extension_suffix=".duckdb_extension"
                stem="${asset_name%.duckdb_extension}"
              fi

              cp "$asset" "release-assets/${stem}-${duck_line}-${platform_suffix}${extension_suffix}"
            done
          done

          test -n "$(find release-assets -type f | head -1)"
          find release-assets -type f | sort

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
