extension:
  name: spc_ext
  description: "Statistical Process Control — process capability (Cp/Cpk/Cpm/Pp/Pk/Ppm/PT + ppm) and control chart limits (I-MR, Xbar-R)"
  version: 0.1.0
  language: Rust
  build: cargo
  license: MIT
  excluded_platforms: "wasm_mvp;wasm_eh;wasm_threads;linux_amd64_musl;windows_amd64_rtools;windows_amd64_mingw"
  requires_toolchains: "rust"
  maintainers:
    - alitrack

repo:
  github: alitrack/duckdb_spc
  ref: refs/tags/v0.1.0
